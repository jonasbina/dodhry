<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · DOD Hry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap">
<link rel="stylesheet" href="css/app.css">
<style>
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 80px; }
  header.a { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
  header.a h1 { font: 800 28px var(--display); margin: 0; letter-spacing: -.02em; }
  .panel { background: var(--surface); border: 1px solid #2a2358; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
  .panel h2 { font: 800 20px var(--display); margin: 0 0 14px; }
  .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; align-items: end; }
  .form .input { font-size: 16px; min-height: 46px; width: 100%; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat { background: var(--surface); border-radius: 16px; padding: 16px 18px; }
  .stat b { display: block; font: 800 34px/1 var(--display); color: var(--gold); }
  .stat span { color: var(--muted); font-size: 14px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-top: 1px solid #2a2358; vertical-align: middle; }
  th { font-size: 13px; color: var(--muted); font-weight: 650; border-top: 0; }
  td.n { font: 800 20px var(--display); color: var(--gold); }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .acts .btn { min-height: 38px; padding: 0 12px; font-size: 14px; }
  .acts input { width: 70px; min-height: 38px; font-size: 15px; padding: 0 10px; }
  .gp { font-size: 13px; color: var(--muted); }
  .gate { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>

<section class="gate" id="gate">
  <form class="login-card" id="pinForm">
    <div class="brand"><span class="brand-mark">🎮</span>Admin</div>
    <h1>Zadej PIN</h1>
    <div class="field">
      <label for="pin">PIN organizátora</label>
      <input class="input" id="pin" type="password" inputmode="numeric" autocomplete="off">
      <div class="hint" id="pinHint" aria-live="polite"></div>
    </div>
    <button class="btn primary big" type="submit">Vstoupit</button>
  </form>
</section>

<div class="wrap" id="app" hidden>
  <header class="a">
    <span class="brand-mark">🎮</span><h1>Admin</h1>
    <div class="spacer"></div>
    <a class="btn primary" href="tv.html" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      Otevřít projektor</a>
    <a class="btn ghost" href="./">Portál</a>
    <button class="btn ghost" id="lock">Zamknout</button>
  </header>

  <div class="stats">
    <div class="stat"><b id="sPlayers">0</b><span>hráčů</span></div>
    <div class="stat"><b id="sDone">0</b><span>splnilo cíl</span></div>
    <div class="stat"><b id="sPts">0</b><span>bodů celkem</span></div>
    <div class="stat"><b id="sActive">0</b><span>aktivní za 10 min</span></div>
  </div>

  <section class="panel">
    <h2>Nastavení</h2>
    <form class="form" id="settingsForm">
      <div class="field"><label for="fTitle">Název portálu</label><input class="input" id="fTitle" maxlength="40"></div>
      <div class="field"><label for="fTarget">Cíl (bodů)</label><input class="input" id="fTarget" type="number" min="1" max="100000"></div>
      <div class="field"><label for="fIdle">Auto odhlášení (min, 0 = vyp.)</label><input class="input" id="fIdle" type="number" min="0" max="240"></div>
      <div class="field"><label for="fPin">PIN adminu</label><input class="input" id="fPin" maxlength="20"></div>
      <button class="btn primary" type="submit">Uložit</button>
    </form>
    <div class="hint" id="savedHint" aria-live="polite"></div>
  </section>

  <section class="panel">
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
      <h2 style="margin:0">Hráči</h2><div class="spacer"></div>
      <input class="input" id="q" type="search" placeholder="Hledat hráče…" style="min-height:42px;font-size:15px">
    </div>
    <div class="scroll"><table>
      <thead><tr><th>#</th><th>Jméno</th><th>Body</th><th>Podle her</th><th>Upravit body</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>

  <section class="panel">
    <h2>Nebezpečná zóna</h2>
    <p style="color:var(--muted);margin-top:0">Smaže všechny hráče a body. Hodí se před začátkem dne otevřených dveří.</p>
    <button class="btn danger" id="reset">Smazat všechny hráče a body</button>
  </section>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module">
  import { getDB } from './js/db.js';
  import { GAMES } from './js/config.js';
  import { $, esc, fmt, toast } from './js/ui.js';

  const db = await getDB();
  let settings = null, players = [];
  const unlocked = () => sessionStorage.getItem('dodhry:admin') === '1';

  db.watchSettings((s) => {
    const first = !settings;
    settings = s;
    if (first || document.activeElement?.closest('#settingsForm') == null) {
      $('fTitle').value = s.title; $('fTarget').value = s.target; $('fIdle').value = s.idleLogoutMin; $('fPin').value = s.adminPin;
    }
    if (unlocked()) open();
    render();
  });

  $('pinForm').addEventListener('submit', (e) => {
    e.preventDefault();
    if (!settings) return;
    if ($('pin').value === String(settings.adminPin)) { sessionStorage.setItem('dodhry:admin', '1'); open(); }
    else { $('pinHint').textContent = 'Špatný PIN.'; $('pinHint').classList.add('err'); $('pin').select(); }
  });
  $('pin').focus();
  $('lock').onclick = () => { sessionStorage.removeItem('dodhry:admin'); location.reload(); };

  let watching = false;
  function open() {
    $('gate').hidden = true; $('app').hidden = false;
    if (!watching) { watching = true; db.watchPlayers((p) => { players = p; render(); }, 2000); }
  }

  $('settingsForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    await db.saveSettings({
      title: $('fTitle').value.trim() || 'DOD Hry',
      target: Math.max(1, parseInt($('fTarget').value, 10) || 100),
      idleLogoutMin: Math.max(0, parseInt($('fIdle').value, 10) || 0),
      adminPin: $('fPin').value.trim() || '2026',
    });
    toast('Nastavení uloženo');
  });

  $('q').addEventListener('input', render);

  function render() {
    if (!settings || $('app').hidden) return;
    const t = Number(settings.target) || 100;
    $('sPlayers').textContent = fmt(players.length);
    $('sDone').textContent = fmt(players.filter((p) => p.points >= t).length);
    $('sPts').textContent = fmt(players.reduce((a, p) => a + (p.points || 0), 0));
    $('sActive').textContent = fmt(players.filter((p) => Date.now() - (p.lastSeen || 0) < 600000).length);
    const q = $('q').value.trim().toLowerCase();
    const rows = players.map((p, i) => [p, i]).filter(([p]) => !q || p.name.toLowerCase().includes(q));
    $('rows').innerHTML = rows.map(([p, i]) => `
      <tr data-k="${esc(p.key)}">
        <td>${i + 1}.</td>
        <td><b>${esc(p.name)}</b>${p.points >= t ? ' <span class="goal-flag">✓ cíl</span>' : ''}</td>
        <td class="n num">${fmt(p.points)}</td>
        <td class="gp">${GAMES.map((g) => p.games?.[g.id]?.points ? `${esc(g.title.split(':')[0])}: ${fmt(p.games[g.id].points)}` : '').filter(Boolean).join(' · ') || '–'}</td>
        <td><div class="acts">
          <input class="input num" type="number" value="10" aria-label="Počet bodů pro ${esc(p.name)}">
          <button class="btn" data-a="add">+ Přidat</button>
          <button class="btn" data-a="sub">− Odebrat</button>
          <button class="btn danger" data-a="del">Smazat</button>
        </div></td>
      </tr>`).join('') || '<tr><td colspan="5" class="empty">Žádní hráči.</td></tr>';
  }

  $('rows').addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-a]'); if (!b) return;
    const tr = b.closest('tr'), k = tr.dataset.k, p = players.find((x) => x.key === k);
    const n = Math.abs(parseInt(tr.querySelector('input').value, 10) || 0);
    if (b.dataset.a === 'add' && n) { await db.adjust(k, n); toast(`<b>+${n}</b> pro ${esc(p.name)}`); }
    if (b.dataset.a === 'sub' && n) { await db.adjust(k, -n); toast(`<b>−${n}</b> pro ${esc(p.name)}`); }
    if (b.dataset.a === 'del' && confirm(`Smazat hráče „${p.name}“ i s body? Nejde to vrátit.`)) { await db.removePlayer(k); toast(`Hráč ${esc(p.name)} smazán`); }
  });

  $('reset').onclick = async () => {
    const ans = prompt('Smaže to VŠECHNY hráče a body. Pro potvrzení napiš SMAZAT');
    if (ans !== 'SMAZAT') return;
    await db.resetAll();
    toast('Vše smazáno');
  };
</script>
</body>
</html>
