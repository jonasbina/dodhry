<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Žebříček – projektor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap">
<link rel="stylesheet" href="css/app.css">
<style>
  /* Projektor: velké písmo čitelné ze zadní řady, vysoký kontrast, nic interaktivního. */
  html, body { overflow: hidden; }
  body { background: radial-gradient(1400px 700px at 50% 120%, #3a1f8a 0%, transparent 60%), var(--bg); }
  .tv { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 3.2vh 3.2vw; gap: 3vh; }
  .tv-head { display: flex; align-items: center; gap: 1.4vw; }
  .tv-head .brand-mark { width: 5.6vh; height: 5.6vh; border-radius: 1.6vh; font-size: 3vh; }
  .tv-head h1 { font: 800 5.4vh/1 var(--display); letter-spacing: -.03em; margin: 0; }
  .tv-head .live { margin-left: auto; display: flex; align-items: center; gap: .8vw; font: 700 2.2vh var(--ui); color: var(--muted); }
  .dot { width: 1.4vh; height: 1.4vh; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 0 rgba(255, 93, 115, .7); animation: pulse 1.8s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 1.4vh rgba(255, 93, 115, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 93, 115, 0); } }

  .tv-body { display: grid; grid-template-columns: 1.15fr 1fr .8fr; gap: 2.4vw; min-height: 0; }
  .podium { display: grid; grid-template-rows: repeat(3, 1fr); gap: 2vh; min-height: 0; }
  .pod { position: relative; display: flex; align-items: center; gap: 1.6vw; padding: 0 2vw; border-radius: 3vh; background: var(--surface); border: 2px solid #2a2358; overflow: hidden; }
  .pod.p1 { background: linear-gradient(120deg, #3a2a0a, #1b1640 70%); border-color: #8a6a1a; }
  .pod.p2 { background: linear-gradient(120deg, #2a2d3d, #1b1640 70%); border-color: #4b5068; }
  .pod.p3 { background: linear-gradient(120deg, #3a2414, #1b1640 70%); border-color: #7a4a2a; }
  .pod .medal { font: 800 9vh/1 var(--display); width: 8vh; text-align: center; }
  .p1 .medal { color: #ffd36b; } .p2 .medal { color: #d8dcef; } .p3 .medal { color: #f0a46b; }
  .pod .nm { font: 800 5.6vh/1.05 var(--display); letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  .pod .sc { font: 800 7vh/1 var(--display); color: var(--gold); letter-spacing: -.03em; }
  .pod .sc small { display: block; font: 600 1.8vh var(--ui); color: var(--muted); text-align: right; letter-spacing: 0; }

  .rest { display: grid; grid-auto-rows: 1fr; gap: 1vh; min-height: 0; }
  .row { display: grid; grid-template-columns: 6vh 1fr auto; align-items: center; gap: 1vw; padding: 0 1.6vw; border-radius: 1.6vh; background: rgba(27, 22, 64, .7); }
  .row .rk { font: 800 3.2vh var(--display); color: var(--muted); }
  .row .nm { font: 700 3.4vh/1.1 var(--ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sc { font: 800 3.8vh var(--display); color: var(--gold); }
  .ok { color: var(--ok); font-size: .7em; margin-left: .6vw; }

  .feed { display: flex; flex-direction: column; gap: 1.2vh; min-height: 0; overflow: hidden; }
  .feed h2 { font: 800 2.6vh var(--display); color: var(--muted); margin: 0 0 .6vh; text-transform: uppercase; letter-spacing: .08em; }
  .ev { display: grid; grid-template-columns: 1fr auto; gap: .2vh 1vw; padding: 1.4vh 1.4vw; border-radius: 1.6vh; background: var(--surface); animation: ev-in .5s cubic-bezier(.2, 1.3, .4, 1) both; }
  .ev b { font: 700 2.6vh var(--ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev .p { font: 800 3vh var(--display); color: var(--gold); grid-row: span 2; align-self: center; }
  .ev .p.neg { color: var(--bad); }
  .ev span { font-size: 2vh; color: var(--muted); }
  @keyframes ev-in { from { opacity: 0; transform: translateX(3vw); } }

  .tv-foot { display: flex; align-items: center; gap: 2vw; font: 600 2.4vh var(--ui); color: var(--muted); }
  .tv-foot b { color: var(--text); }
  .tv-foot .goal { margin-left: auto; color: var(--gold); }
  .empty-tv { grid-column: 1 / -1; display: grid; place-items: center; font: 800 6vh var(--display); color: var(--muted); }
  .flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 .6vh var(--gold); } 100% { box-shadow: 0 0 0 0 transparent; } }
</style>
</head>
<body>
<div class="tv">
  <header class="tv-head">
    <span class="brand-mark">🎮</span>
    <h1><span data-title>DOD Hry</span> · Žebříček</h1>
    <div class="live"><span class="dot"></span> Živě</div>
  </header>
  <div class="tv-body" id="body">
    <div class="podium" id="podium"></div>
    <div class="rest" id="rest"></div>
    <div class="feed" id="feed"><h2>Právě získali</h2></div>
  </div>
  <footer class="tv-foot">
    <span>Hraj taky: <b id="url"></b></span>
    <span><b id="count">0</b> hráčů</span>
    <span class="goal">Cíl: <span id="goal">100</span> bodů · splnilo <span id="done">0</span></span>
  </footer>
</div>
<script type="module">
  import { getDB } from './js/db.js';
  import { gameById } from './js/config.js';
  import { $, esc, fmt } from './js/ui.js';

  const db = await getDB();
  let settings = { target: 100 }, players = [], lastScores = new Map();
  $('url').textContent = location.host + location.pathname.replace(/tv\.html$/, '');

  db.watchSettings((s) => {
    settings = s;
    document.querySelectorAll('[data-title]').forEach((el) => (el.textContent = s.title));
    $('goal').textContent = fmt(s.target);
    render();
  });
  db.watchPlayers((p) => { players = p; render(); }, 500);
  db.watchEvents((evs) => {
    const html = evs.slice(0, 7).map((e) => {
      const g = e.gameId ? gameById(e.gameId)?.title : 'od organizátorů';
      return `<div class="ev"><b>${esc(e.name)}</b><span class="p num ${e.points < 0 ? 'neg' : ''}">${e.points > 0 ? '+' : ''}${fmt(e.points)}</span>
        <span>${e.reason === 'win' ? '🏆 výhra · ' : ''}${esc(g || '')}</span></div>`;
    }).join('');
    $('feed').innerHTML = '<h2>Právě získali</h2>' + html;
  }, 7);

  function render() {
    const t = Number(settings.target) || 100;
    $('count').textContent = fmt(players.length);
    $('done').textContent = fmt(players.filter((p) => p.points >= t).length);
    if (!players.length) {
      $('podium').innerHTML = '';
      $('rest').innerHTML = '<div class="empty-tv">Zatím nikdo nehraje</div>';
      return;
    }
    const ok = (p) => (p.points >= t ? '<span class="ok">✓</span>' : '');
    const changed = (p) => { const c = lastScores.has(p.key) && lastScores.get(p.key) !== p.points; return c ? 'flash' : ''; };
    $('podium').innerHTML = players.slice(0, 3).map((p, i) => `
      <div class="pod p${i + 1} ${changed(p)}"><span class="medal">${i + 1}</span>
        <span class="nm">${esc(p.name)}${ok(p)}</span>
        <span class="sc num">${fmt(p.points)}<small>bodů</small></span></div>`).join('');
    const rest = players.slice(3, 12);
    $('rest').style.gridTemplateRows = `repeat(${Math.max(rest.length, 6)}, 1fr)`;
    $('rest').innerHTML = rest.map((p, i) => `
      <div class="row ${changed(p)}"><span class="rk num">${i + 4}.</span><span class="nm">${esc(p.name)}${ok(p)}</span><span class="sc num">${fmt(p.points)}</span></div>`).join('');
    lastScores = new Map(players.map((p) => [p.key, p.points]));
  }

  // kurzor pryč, ať neruší na projektoru
  let hide; document.addEventListener('mousemove', () => { document.body.style.cursor = ''; clearTimeout(hide); hide = setTimeout(() => (document.body.style.cursor = 'none'), 2000); });
  document.addEventListener('dblclick', () => document.documentElement.requestFullscreen?.());
</script>
</body>
</html>
